@if (isVisible()) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-50 dark:bg-zinc-950/80 backdrop-blur-sm animate-fade-in">
    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 rounded-3xl max-w-lg w-full relative overflow-hidden shadow-2xl animate-slide-up" (click)="$event.stopPropagation()">
      
      <!-- Background Effects -->
      <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
      <div class="absolute bottom-0 left-0 w-64 h-64 bg-rose-500/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
      
      <!-- Close Button -->
      <button (click)="close()" class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-slate-50 dark:bg-zinc-950/50 flex items-center justify-center text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:text-white hover:bg-slate-100 dark:bg-zinc-800 transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>

      <div class="relative z-10 p-8 sm:p-12 text-center">
        <!-- Gift Icon -->
        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30">
          <span class="material-symbols-outlined !text-[40px] text-slate-900 dark:text-white">featured_seasonal_and_gifts</span>
        </div>

        <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-2">Welcome to the Club!</h2>
        <p class="text-slate-500 dark:text-zinc-400 mb-8 max-w-sm mx-auto">Get 10% off your first purchase when you join our community today.</p>

        @if (!isRevealed()) {
          <div class="flex flex-col gap-3">
            <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" 
                   placeholder="Enter your email address" 
                   class="w-full bg-slate-50 dark:bg-zinc-950/50 border border-slate-300 dark:border-zinc-700/50 rounded-xl px-4 py-4 text-slate-900 dark:text-white outline-none focus:border-indigo-500 text-center transition-colors">
            
            <button (click)="revealDiscount()" [disabled]="!email() || !email().includes('@')"
                    class="w-full py-4 bg-white text-zinc-950 font-black rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-all disabled:opacity-50 shadow-xl">
              Unlock My 10% Off
            </button>
            
            <button (click)="close()" class="text-sm font-bold text-slate-400 dark:text-zinc-500 hover:text-slate-600 dark:text-zinc-300 mt-2">
              No thanks, I prefer paying full price
            </button>
          </div>
        } @else {
          <!-- Revealed State -->
          <div class="bg-indigo-500/10 border border-indigo-500/20 rounded-2xl p-6 mb-4 animate-fade-in">
            <p class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2">Your Code</p>
            <div class="flex items-center justify-center gap-3">
              <span class="text-3xl font-black text-slate-900 dark:text-white tracking-widest">{{ discountCode() }}</span>
              <button (click)="copyCode()" class="w-10 h-10 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center hover:bg-indigo-500 hover:text-slate-900 dark:text-white transition-all">
                <span class="material-symbols-outlined !text-[20px]">content_copy</span>
              </button>
            </div>
          </div>
          
          <button (click)="close()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-slate-900 dark:text-white font-black rounded-xl transition-all shadow-lg shadow-indigo-500/20">
            Start Shopping Now
          </button>
        }
      </div>
    </div>
  </div>
}
