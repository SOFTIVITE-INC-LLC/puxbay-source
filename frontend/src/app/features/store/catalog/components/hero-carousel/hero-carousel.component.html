<div class="relative w-full h-[400px] sm:h-[500px] rounded-3xl overflow-hidden shadow-2xl group border border-slate-200 dark:border-white/10" 
     (mouseenter)="stopCarousel()" (mouseleave)="startCarousel()">
  
  @for (slide of slides; track slide.title; let i = $index) {
    <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
         [class.opacity-100]="i === currentSlide()"
         [class.opacity-0]="i !== currentSlide()"
         [class.z-10]="i === currentSlide()"
         [class.z-0]="i !== currentSlide()">
      
      <!-- Background Image with Overlay -->
      <div class="absolute inset-0">
        <img [src]="slide.bgImage" [alt]="slide.title" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-slate-50/90 dark:from-slate-50 dark:from-zinc-950/90 via-slate-50/60 dark:via-zinc-950/60 to-transparent"></div>
        
        <!-- Theme-specific accent glow -->
        <div class="absolute top-0 right-0 w-96 h-96 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 opacity-30"
             [ngClass]="{
               'bg-indigo-500': slide.theme === 'indigo',
               'bg-rose-500': slide.theme === 'rose',
               'bg-emerald-500': slide.theme === 'emerald'
             }"></div>
      </div>

      <!-- Content -->
      <div class="relative z-20 h-full flex flex-col justify-center p-8 sm:p-16 max-w-2xl">
        <span class="inline-flex px-3 py-1 bg-white/10 text-slate-900 dark:text-white rounded-lg text-xs font-bold uppercase tracking-wider mb-4 self-start backdrop-blur-md border border-white/20 animate-slide-up" style="animation-delay: 0.1s">
          Featured Collection
        </span>
        <h2 class="text-4xl sm:text-6xl font-black text-slate-900 dark:text-white tracking-tight mb-4 animate-slide-up leading-tight" style="animation-delay: 0.2s">
          {{ slide.title }}
        </h2>
        <p class="text-lg sm:text-xl text-slate-600 dark:text-zinc-300 mb-8 animate-slide-up max-w-xl" style="animation-delay: 0.3s">
          {{ slide.subtitle }}
        </p>
        
        <div class="animate-slide-up" style="animation-delay: 0.4s">
          <a [routerLink]="slide.ctaLink" 
             class="inline-flex items-center gap-2 px-8 py-4 rounded-xl font-bold text-slate-900 dark:text-white transition-all shadow-lg hover:scale-105 active:scale-95"
             [ngClass]="{
               'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/30': slide.theme === 'indigo',
               'bg-rose-600 hover:bg-rose-700 shadow-rose-500/30': slide.theme === 'rose',
               'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/30': slide.theme === 'emerald'
             }">
            {{ slide.ctaText }}
            <span class="material-symbols-outlined !text-[20px]">arrow_forward</span>
          </a>
        </div>
      </div>
    </div>
  }

  <!-- Navigation Arrows -->
  <button (click)="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-slate-50 dark:bg-zinc-950/50 backdrop-blur-md border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-900 dark:text-white opacity-0 group-hover:opacity-100 transition-all hover:bg-white/10 hover:scale-110">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button (click)="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-slate-50 dark:bg-zinc-950/50 backdrop-blur-md border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-900 dark:text-white opacity-0 group-hover:opacity-100 transition-all hover:bg-white/10 hover:scale-110">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>

  <!-- Dots -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2">
    @for (slide of slides; track slide.title; let i = $index) {
      <button (click)="goToSlide(i)" 
              class="h-1.5 rounded-full transition-all duration-300"
              [class.w-8]="i === currentSlide()"
              [class.w-2]="i !== currentSlide()"
              [ngClass]="i === currentSlide() ? 'bg-white' : 'bg-white/30 hover:bg-white/50'">
      </button>
    }
  </div>
</div>
