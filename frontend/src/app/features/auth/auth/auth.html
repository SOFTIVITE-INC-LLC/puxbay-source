<div
  class="min-h-screen flex items-center justify-center bg-zinc-50 dark:bg-black p-4 relative overflow-hidden text-zinc-900 dark:text-white"
>
  <!-- Animated Background Gradients -->
  <div
    class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"
  ></div>
  <div
    class="absolute top-0 right-1/4 w-96 h-96 bg-purple-500/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"
  ></div>
  <div
    class="absolute -bottom-32 left-1/2 w-96 h-96 bg-pink-500/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"
  ></div>

  <!-- Login Form Container -->
  <div
    class="w-full max-w-md relative z-10 glass-panel p-8 sm:p-12 rounded-3xl shadow-2xl border border-white/20 dark:border-white/10 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-xl"
  >
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white mb-4 shadow-lg shadow-blue-500/30 transform -rotate-6"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">Welcome Back</h1>
      <p class="text-zinc-500 dark:text-zinc-400 mt-2 text-sm">
        Enter your credentials to access your store dashboard.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      @if (errorMsg()) {
        <div
          class="p-4 bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 rounded-xl text-sm font-medium flex items-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          {{ errorMsg() }}
        </div>
      }

      <div>
        <label class="block text-sm font-medium mb-1.5 text-zinc-700 dark:text-zinc-300"
          >Email Address</label
        >
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              ></path>
            </svg>
          </div>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="admin@example.com"
            class="w-full pl-10 pr-4 py-3 bg-white/50 dark:bg-zinc-950/50 border border-zinc-300 dark:border-zinc-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
          />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Password</label>
          <a href="#" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline"
            >Forgot password?</a
          >
        </div>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              ></path>
            </svg>
          </div>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 bg-white/50 dark:bg-zinc-950/50 border border-zinc-300 dark:border-zinc-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="authService.loading()"
        class="w-full py-3.5 bg-zinc-900 dark:bg-white text-white dark:text-black font-bold rounded-xl shadow-lg hover:opacity-90 transition-all transform active:scale-95 flex items-center justify-center gap-2"
      >
        @if (!authService.loading()) {
          <span>Sign In</span>
        }
        @if (authService.loading()) {
          <div
            class="animate-spin rounded-full h-5 w-5 border-b-2 border-white dark:border-black"
          ></div>
        }
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-zinc-200/50 dark:border-zinc-800/50 text-center">
      <p class="text-sm text-zinc-500">
        Don't have an account?
        <a href="#" class="font-medium text-blue-600 dark:text-blue-400 hover:underline"
          >Register now</a
        >
      </p>
    </div>
  </div>
</div>
