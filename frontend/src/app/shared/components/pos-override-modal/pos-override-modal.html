<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-900/60 backdrop-blur-sm animate-fade-in">
  <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-slide-up border border-zinc-200 dark:border-zinc-800">
    <div class="p-6 text-center border-b border-zinc-100 dark:border-zinc-800">
      <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h3 class="text-xl font-bold text-zinc-900 dark:text-white">Manager Override</h3>
      <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-2">
        A manager PIN is required to {{ actionName() }}.
      </p>
    </div>

    <div class="p-6">
      <div class="flex justify-center gap-3 mb-8">
        @for (i of [0, 1, 2, 3]; track i) {
          <div class="w-14 h-16 rounded-xl border-2 flex items-center justify-center text-3xl font-bold transition-all"
               [class.border-red-500]="pin.length === i"
               [class.border-zinc-200]="pin.length !== i"
               [class.dark:border-zinc-700]="pin.length !== i && pin.length < i"
               [class.text-zinc-900]="true"
               [class.dark:text-white]="true">
            @if (pin.length > i) {
              <span class="animate-pop-in">•</span>
            }
          </div>
        }
      </div>

      <div class="grid grid-cols-3 gap-3 mb-6">
        @for (num of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track num) {
          <button (click)="onKeypadPress(num)" class="h-16 rounded-2xl bg-zinc-50 dark:bg-zinc-800/50 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-2xl font-semibold text-zinc-900 dark:text-white transition-colors active:scale-95">
            {{ num }}
          </button>
        }
        <button (click)="onCancel()" class="h-16 rounded-2xl bg-zinc-50 dark:bg-zinc-800/50 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-semibold text-red-600 dark:text-red-400 transition-colors active:scale-95">
          CANCEL
        </button>
        <button (click)="onKeypadPress(0)" class="h-16 rounded-2xl bg-zinc-50 dark:bg-zinc-800/50 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-2xl font-semibold text-zinc-900 dark:text-white transition-colors active:scale-95">
          0
        </button>
        <button (click)="onBackspace()" class="h-16 rounded-2xl bg-zinc-50 dark:bg-zinc-800/50 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 flex items-center justify-center transition-colors active:scale-95">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
        </button>
      </div>

      <button (click)="onConfirm()" [disabled]="pin.length !== 4" 
              class="w-full h-14 rounded-xl font-bold text-white transition-all transform active:scale-[0.98]"
              [class.bg-red-600]="pin.length === 4"
              [class.hover:bg-red-700]="pin.length === 4"
              [class.bg-zinc-300]="pin.length !== 4"
              [class.dark:bg-zinc-700]="pin.length !== 4"
              [class.shadow-lg]="pin.length === 4"
              [class.shadow-red-600/30]="pin.length === 4">
        AUTHORIZE
      </button>
    </div>
  </div>
</div>
