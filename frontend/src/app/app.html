<router-outlet></router-outlet>
<app-alert></app-alert>

@if(showInstallPrompt()) {
<div class="fixed bottom-4 sm:bottom-8 left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-[420px] z-[9999] bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-700/50 animate-fade-in-up backdrop-blur-xl bg-opacity-95">
  <div class="w-12 h-12 bg-white rounded-xl shadow-inner flex items-center justify-center shrink-0 overflow-hidden p-1">
    <img src="/logo.png" alt="Puxbay Logo" class="w-full h-full object-contain">
  </div>
  <div class="flex-1 min-w-0">
    <h3 class="font-bold text-slate-50 text-base leading-tight">Install Puxbay</h3>
    <p class="text-xs text-slate-400 mt-0.5 leading-snug">Install on your device for a native experience</p>
  </div>
  <div class="flex flex-col gap-2 shrink-0">
    <button (click)="installPwa()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white rounded-lg transition-colors shadow-lg cursor-pointer w-full">Install</button>
    <button (click)="dismissPrompt()" class="px-4 py-1.5 text-[11px] font-bold text-slate-400 hover:text-white transition-colors cursor-pointer w-full bg-slate-800 rounded-lg">Later</button>
  </div>
</div>
}
