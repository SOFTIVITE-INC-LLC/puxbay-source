@if (alertService.state().isOpen) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-zinc-900/40 backdrop-blur-md p-4" (click)="onCancel()">
    <div class="alert-dialog bg-white/90 dark:bg-zinc-900/90 backdrop-blur-2xl rounded-3xl w-full max-w-sm overflow-hidden shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] border border-white/50 dark:border-white/10" (click)="$event.stopPropagation()">
      <div class="p-6">
        <div class="flex flex-col items-center text-center space-y-4">
          <!-- Icon depending on type -->
          @if (alertService.state().type === 'confirm') {
            <div class="w-16 h-16 rounded-full bg-orange-500/10 text-orange-500 flex items-center justify-center shrink-0 mb-2">
              <span class="material-symbols-outlined !text-[32px]">warning</span>
            </div>
          } @else {
            <div class="w-16 h-16 rounded-full bg-blue-500/10 text-blue-500 flex items-center justify-center shrink-0 mb-2">
              <span class="material-symbols-outlined !text-[32px]">info</span>
            </div>
          }

          <div>
            <h3 class="text-xl font-black text-zinc-900 dark:text-white tracking-tight mb-2">{{ alertService.state().title }}</h3>
            <p class="text-[15px] font-medium text-zinc-500 dark:text-zinc-400 leading-snug">
              {{ alertService.state().message }}
            </p>
          </div>
        </div>
      </div>
      
      <div class="p-4 bg-zinc-50/50 dark:bg-black/20 border-t border-zinc-200/50 dark:border-zinc-800/50 flex gap-3">
        @if (alertService.state().type === 'confirm') {
          <button (click)="onCancel()" class="flex-1 py-3 px-4 rounded-xl font-bold text-[14px] text-zinc-600 dark:text-zinc-400 bg-white dark:bg-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors shadow-sm ring-1 ring-inset ring-zinc-200 dark:ring-white/10">
            {{ alertService.state().cancelText }}
          </button>
        }
        <button (click)="onConfirm()" class="flex-1 py-3 px-4 rounded-xl font-bold text-[14px] text-white transition-all shadow-md active:scale-[0.98]"
                [ngClass]="alertService.state().type === 'confirm' ? 'bg-orange-500 hover:bg-orange-600 shadow-orange-500/25' : 'bg-blue-500 hover:bg-blue-600 shadow-blue-500/25'">
          {{ alertService.state().confirmText }}
        </button>
      </div>
    </div>
  </div>
}
