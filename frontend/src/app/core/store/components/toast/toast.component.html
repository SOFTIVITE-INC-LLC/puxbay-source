<div class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border backdrop-blur-xl animate-slide-up"
         [ngClass]="{
           'bg-emerald-500/90 border-emerald-500/50 text-white': toast.type === 'success',
           'bg-rose-500/90 border-rose-500/50 text-white': toast.type === 'error',
           'bg-zinc-800/90 border-zinc-700 text-white': toast.type === 'info'
         }">
      <span class="material-symbols-outlined !text-[20px]">
        {{ toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : 'info' }}
      </span>
      <span class="text-sm font-medium">{{ toast.message }}</span>
      <button (click)="toastService.remove(toast.id)" class="ml-2 hover:opacity-70 transition-opacity">
        <span class="material-symbols-outlined !text-[16px]">close</span>
      </button>
    </div>
  }
</div>
