<div class="relative w-full h-[100dvh] bg-slate-100 dark:bg-[#020307] text-slate-900 dark:text-white font-sans overflow-hidden">
  
  <div class="h-full w-full flex md:p-3 gap-2 md:gap-3 relative z-10 bg-slate-100">
    <!-- Deep background layer (can be styled further if needed) -->
    
    <!-- Mobile Backdrop -->
    @if (layout.isMobileSidebarOpen()) {
      <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden" (click)="layout.closeSidebar()"></div>
    }

    <!-- ── Sidebar (Floating Panel) ── -->
    <div class="fixed lg:static inset-y-3 left-3 z-50 lg:z-40 flex flex-col rounded-2xl overflow-hidden shadow-2xl lg:shadow-xl ring-1 ring-slate-200 bg-white w-64 transition-transform duration-300 ease-in-out lg:translate-x-0 h-[calc(100%-24px)] lg:h-full lg:flex-shrink-0"
         [class.-translate-x-[120%]]="!layout.isMobileSidebarOpen()"
         [class.translate-x-0]="layout.isMobileSidebarOpen()">
      <app-sidebar class="h-full w-full"></app-sidebar>
    </div>

    <!-- ── Main Area (Flex Column) ── -->
    <div class="flex-1 flex flex-col min-w-0 gap-3 h-full z-20">

      <!-- ── Topbar (Floating Panel) ── -->
      <div class="flex-shrink-0 z-30 rounded-2xl overflow-hidden shadow-sm ring-1 ring-slate-200 bg-white h-16">
        <app-navbar></app-navbar>
      </div>

      <!-- ── Content (Floating Panel) ── -->
      <main class="flex-1 min-h-0 rounded-2xl overflow-y-auto relative ring-1 ring-slate-200 shadow-sm bg-white custom-scrollbar">
        <div class="w-full min-h-full">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>
  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
</style>
