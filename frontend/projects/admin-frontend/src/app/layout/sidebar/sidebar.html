<aside class="w-full h-full bg-white text-slate-700 flex flex-col relative overflow-hidden">
  
  <div class="h-16 flex items-center px-6 border-b border-slate-100 relative z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-white shadow-md shadow-indigo-500/20 overflow-hidden flex items-center justify-center p-[1px]">
        <img src="/logo.png" alt="Puxbay Logo" class="w-full h-full object-cover rounded-[7px]" />
      </div>
      <span class="font-bold text-lg text-slate-900 tracking-tight">Puxbay Admin</span>
    </div>
  </div>

  <!-- Scrollable Nav -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6 relative z-10 custom-scrollbar">
    <div *ngFor="let cat of menuCategories">
      <h3 class="px-3 mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">{{ cat.category }}</h3>
      <div class="space-y-1">
        <a *ngFor="let item of cat.items"
           [routerLink]="item.route"
           (click)="layout.closeSidebar()"
           routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold shadow-sm"
           [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 hover:bg-slate-50 group border border-transparent hover:border-slate-100 cursor-pointer">
           
          <span class="material-symbols-outlined text-lg text-slate-400 group-hover:text-indigo-500 transition-colors"
                [class.text-indigo-600]="item.route === currentRoute()">{{ item.icon }}</span>
          <span class="truncate">{{ item.label }}</span>
        </a>
      </div>
    </div>
  </nav>
</aside>

<style>
/* Custom scrollbar for dark sidebar */
.custom-scrollbar::-webkit-scrollbar {
  width: 4px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #334155; 
  border-radius: 4px;
}
.custom-scrollbar:hover::-webkit-scrollbar-thumb {
  background: #475569; 
}
</style>
