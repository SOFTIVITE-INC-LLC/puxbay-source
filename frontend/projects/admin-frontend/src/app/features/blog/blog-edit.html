<div class="p-8 max-w-4xl mx-auto">
  <div class="flex items-center gap-4 mb-8">
    <a routerLink="/blog" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors cursor-pointer">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">{{ isNew() ? 'New Blog Post' : 'Edit Blog Post' }}</h1>
      <p class="text-slate-500 mt-1">Publish news and updates to the main platform.</p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="flex justify-center p-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>
  } @else {
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      
      @if (error()) {
        <div class="p-4 bg-red-50 text-red-600 border-b border-red-100 font-medium">
          {{ error() }}
        </div>
      }

      <div class="p-6 space-y-6">
        <!-- Title & Slug -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Title</label>
            <input type="text"
                   [value]="post().title"
                   (input)="updateField('title', $any($event.target).value)"
                   (blur)="generateSlug()"
                   placeholder="e.g. New Feature Launch"
                   class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Slug</label>
            <input type="text"
                   [value]="post().slug"
                   (input)="updateField('slug', $any($event.target).value)"
                   placeholder="e.g. new-feature-launch"
                   class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <!-- Category -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Category Name</label>
            <input type="text"
                   [value]="post().category"
                   (input)="updateField('category', $any($event.target).value)"
                   placeholder="e.g. Product Update"
                   class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Category Color</label>
            <select [value]="post().category_color"
                    (change)="updateField('category_color', $any($event.target).value)"
                    class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="cyan">Cyan</option>
              <option value="purple">Purple</option>
              <option value="green">Green</option>
              <option value="slate">Slate (Default)</option>
            </select>
          </div>
        </div>

        <!-- Excerpt -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Excerpt</label>
          <textarea [value]="post().excerpt || ''"
                    (input)="updateField('excerpt', $any($event.target).value)"
                    rows="2"
                    placeholder="Brief summary shown on the blog listing..."
                    class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-y"></textarea>
        </div>

        <!-- Content -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Content</label>
          <textarea [value]="post().content"
                    (input)="updateField('content', $any($event.target).value)"
                    rows="15"
                    placeholder="Full blog post content (HTML supported)..."
                    class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-y font-mono"></textarea>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Status</label>
          <select [value]="post().status"
                  (change)="updateField('status', $any($event.target).value)"
                  class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="draft">Draft (Hidden)</option>
            <option value="published">Published</option>
          </select>
        </div>
      </div>

      <!-- Footer Action -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
        <a routerLink="/blog" class="px-5 py-2.5 text-sm font-bold text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition cursor-pointer">
          Cancel
        </a>
        <button (click)="save()" [disabled]="isSaving()" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition shadow-sm flex items-center gap-2 cursor-pointer">
          @if (isSaving()) {
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            Saving...
          } @else {
            <span class="material-symbols-outlined text-[18px]">save</span>
            Save Post
          }
        </button>
      </div>

    </div>
  }
</div>
