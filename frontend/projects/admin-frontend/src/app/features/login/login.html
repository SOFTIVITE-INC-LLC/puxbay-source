<div class="min-h-screen bg-[#0B0F19] flex items-center justify-center p-4 relative overflow-hidden font-sans">
  
  <!-- Premium ambient background -->
  <div class="absolute inset-0 z-0">
    <!-- Grid overlay -->
    <div class="absolute inset-0 bg-[#005b96_1px,transparent_1px),#005b96_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:none]"></div>
    
    <!-- Animated glow orbs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-[128px] animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-violet-600/10 rounded-full blur-[128px]"></div>
  </div>

  <div class="w-full max-w-lg z-10 relative animate-[fadeIn_0.5s_ease-out]">
    
    <!-- Logo & Brand Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-[0_0_40px_-10px_rgba(99,102,241,0.5)] mb-6 ring-1 ring-white/20 p-[2px]">
        <img src="/logo.png" alt="Puxbay Logo" class="w-full h-full object-cover rounded-[14px]" />
      </div>
      <h1 class="text-4xl font-extrabold text-primary-600 dark:text-primary-400 tracking-tight">Puxbay Admin</h1>
      <p class="text-slate-400 mt-3 text-sm tracking-wide uppercase font-medium">Secure Portal</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[#111827]/80 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl p-8 sm:p-10 relative overflow-hidden before:absolute before:inset-0 before: before:from-white/5 before: before:pointer-events-none">
      
      <form (ngSubmit)="onSubmit()" class="space-y-6 relative z-10">
        
        <!-- Error State -->
        <div *ngIf="error()" class="bg-red-500/10 border border-red-500/20 rounded-xl p-4 flex items-center gap-3 animate-[slideIn_0.3s_ease-out]">
          <span class="material-symbols-outlined text-red-400">error</span>
          <p class="text-sm text-red-400 font-medium">{{ error() }}</p>
        </div>

        <!-- Input Fields -->
        <div class="space-y-5">
          <div>
            <label for="username" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                <span class="material-symbols-outlined">person</span>
              </div>
              <input type="text" id="username" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" required
                     class="block w-full pl-12 pr-4 py-3.5 bg-[#0B0F19]/50 border border-white/10 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm shadow-inner" 
                     placeholder="admin@puxbay.com">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
            </div>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                <span class="material-symbols-outlined">key</span>
              </div>
              <input type="password" id="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required
                     class="block w-full pl-12 pr-4 py-3.5 bg-[#0B0F19]/50 border border-white/10 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all sm:text-sm shadow-inner" 
                     placeholder="••••••••">
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="isLoading()" 
                class="w-full relative overflow-hidden group flex justify-center items-center py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-70 disabled:cursor-not-allowed transition-all shadow-[0_0_20px_-5px_rgba(99,102,241,0.4)] hover:shadow-[0_0_25px_-5px_rgba(99,102,241,0.6)] mt-8">
          
          <div class="absolute inset-0 w-full h-full bg-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
          
          <span *ngIf="isLoading()" class="animate-spin inline-block w-5 h-5 border-2 border-white/20 border-t-white rounded-full mr-3 relative z-10"></span>
          <span class="relative z-10">{{ isLoading() ? 'Authenticating...' : 'Sign In to Dashboard' }}</span>
          <span *ngIf="!isLoading()" class="material-symbols-outlined ml-2 relative z-10 transition-transform group-hover:translate-x-1">arrow_forward</span>
        </button>

      </form>
    </div>
    
    <p class="text-center text-slate-500 text-xs mt-8 font-medium">
      Protected by Puxbay Security Services
    </p>
  </div>
</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  100% { transform: translateX(100%); }
}
</style>
