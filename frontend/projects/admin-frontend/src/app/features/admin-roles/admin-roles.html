<div class="p-8 max-w-7xl mx-auto flex gap-8">
  
  <!-- Left Side: Roles List -->
  <div class="w-1/3 flex flex-col gap-4">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Admin Roles</h1>
      <button (click)="openCreateModal()" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700 transition cursor-pointer">
        + New Role
      </button>
    </div>

    <div *ngIf="isLoading()" class="flex justify-center p-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
    </div>

    <div *ngIf="!isLoading()" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div *ngFor="let role of roles()" (click)="openRole(role)" 
           class="p-4 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition flex justify-between items-center"
           [ngClass]="selectedRole()?.id === role.id ? 'bg-indigo-50 border-l-4 border-l-indigo-600' : ''">
        <span class="font-bold text-slate-800">{{ role.name }}</span>
        <span class="material-symbols-outlined text-slate-400 text-sm">chevron_right</span>
      </div>
      <div *ngIf="roles().length === 0" class="p-8 text-center text-slate-500">
        No roles created.
      </div>
    </div>
  </div>

  <!-- Right Side: Permissions Editor -->
  <div class="flex-1">
    <div *ngIf="!selectedRole()" class="h-full flex flex-col items-center justify-center text-slate-400 bg-slate-50/50 rounded-2xl border border-slate-200 border-dashed p-12">
      <span class="material-symbols-outlined text-4xl mb-3">admin_panel_settings</span>
      <p class="font-medium">Select a role to view or edit its permissions.</p>
    </div>

    <div *ngIf="selectedRole()" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="mb-6 flex justify-between items-start">
        <div>
          <h2 class="text-xl font-bold text-slate-900">{{ selectedRole()!.name }} Permissions</h2>
          <p class="text-sm text-slate-500 mt-1">Select the access level for users with this role.</p>
        </div>
        <button (click)="savePermissions()" [disabled]="isSaving()" class="px-4 py-2 bg-slate-900 text-white text-sm font-bold rounded-xl hover:bg-slate-800 disabled:opacity-50 transition cursor-pointer">
          {{ isSaving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <label *ngFor="let perm of availablePermissions" class="flex items-start gap-3 p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition" [ngClass]="selectedPermissions().includes(perm.id) ? 'bg-indigo-50/50 border-indigo-200' : ''">
          <input type="checkbox" [checked]="selectedPermissions().includes(perm.id)" (change)="togglePermission(perm.id)" class="mt-1 rounded text-indigo-600 focus:ring-indigo-500">
          <div>
            <div class="font-bold text-slate-800 text-sm">{{ perm.name }}</div>
            <div class="text-xs text-slate-500 font-mono mt-0.5">{{ perm.id }}</div>
          </div>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- Create Role Modal -->
<div *ngIf="isModalOpen()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
    <div class="p-6 border-b border-slate-200 flex justify-between items-center">
      <h2 class="text-lg font-bold text-slate-900">Create Admin Role</h2>
      <button (click)="closeCreateModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-6">
      <label class="block text-sm font-bold text-slate-700 mb-2">Role Name</label>
      <input type="text" [(ngModel)]="newRoleName" placeholder="e.g. Support Agent" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-medium">
    </div>
    <div class="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
      <button (click)="closeCreateModal()" class="px-4 py-2 text-sm font-bold text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition cursor-pointer">Cancel</button>
      <button (click)="createRole()" [disabled]="!newRoleName() || isSaving()" class="px-4 py-2 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition cursor-pointer disabled:opacity-50">Create</button>
    </div>
  </div>
</div>
