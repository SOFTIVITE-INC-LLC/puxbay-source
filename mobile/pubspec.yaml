name: puxbay_mobile
description: "Puxbay Business Management Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────
  go_router: ^15.1.2

  # ── State Management ────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.5

  # ── Networking ──────────────────────────────────────────
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.1

  # ── Secure Storage & Local DB ───────────────────────────
  flutter_secure_storage: ^9.2.4
  hive_ce_flutter: ^2.3.4
  local_auth: ^2.2.0
  sqflite: ^2.4.2
  path: ^1.9.1

  # ── Camera & Scanner ────────────────────────────────────
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1

  # ── UI & Design ─────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  badges: ^3.1.2
  flutter_animate: ^4.5.0
  showcaseview: ^3.0.0

  # ── Utilities ───────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # ── PDF & Printing ──────────────────────────────────────
  pdf: ^3.11.3
  printing: ^5.14.2

  # ── WebSocket ───────────────────────────────────────────
  web_socket_channel: ^3.0.2

  # ── Push Notifications ──────────────────────────────────
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^18.0.1
  get_it: ^9.2.1
  stream_transform: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.9.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

