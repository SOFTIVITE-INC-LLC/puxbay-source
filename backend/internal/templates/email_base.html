<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 30px 40px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .content {
            padding: 40px;
            color: #334155;
            line-height: 1.6;
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 24px;
            font-size: 16px;
        }

        .button-container {
            text-align: center;
            margin: 35px 0;
        }

        .button {
            background-color: #4f46e5;
            color: #ffffff;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
        }

        .footer {
            background-color: #f1f5f9;
            padding: 24px 40px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid #e2e8f0;
        }

        .footer a {
            color: #4f46e5;
            text-decoration: none;
        }

        @media only screen and (max-width: 600px) {
            .container {
                margin: 20px 10px;
                border-radius: 8px;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">Puxbay</div>
        </div>
        <div class="content">
            <h1>{{ .Title }}</h1>

            {{ range .Paragraphs }}
            <p>{{ . }}</p>
            {{ end }}

            {{ if .ActionURL }}
            <div class="button-container">
                <a href="{{ .ActionURL }}" class="button">{{ .ActionText }}</a>
            </div>
            {{ end }}

            <p style="margin-top: 30px; margin-bottom: 0;">
                Thanks,<br>
                <strong>The Puxbay Team</strong>
            </p>
        </div>
        <div class="footer">
            <p style="margin-bottom: 8px;">© {{ .Year }} Puxbay. All rights reserved.</p>
            <p style="margin-bottom: 0;">Need help? Contact us at <a
                    href="mailto:support@puxbay.com">support@puxbay.com</a></p>
        </div>
    </div>
</body>

</html>
